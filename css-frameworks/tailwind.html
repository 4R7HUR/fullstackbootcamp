
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tailwind Grid Example</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Prism CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet">

    <style>

        /* START: Custom Colour Palette */
        :root {
            --colour-primary: #315b7d;
            --colour-secondary: #64748b;
            --colour-success: #39845a;
            --colour-danger: #bd4545;
            --colour-warning: #e5ad35;
            --colour-info: #3999a5;
            --colour-light: #f1f3f5;
            --colour-dark: #273444;
        }
        /* STOP: Custom Colour Palette */


        /* START: Modal Styling */

        /* Control modal code font size */
        #html_template_modal pre,
        #html_template_modal code {
            font-size: 20px;
            line-height: 1.6;
        }

        #html_template_modal pre {
            border-radius: 0;
            margin: 0;
        }

        /* Modal close button */
        #html_template_modal .btn-close {
            filter: invert(1);
            opacity: 1;
            transform: scale(2);
        }

        /* STOP: Modal Styling */

    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- START: Header -->
    <header class="bg-[var(--colour-primary)] text-white p-6 text-center">
        <h1 class="text-2xl font-bold mb-0">My Tailwind Layout</h1>
    </header>
    <!-- STOP: Header -->


    <!-- START: Main Content -->
    <main class="container mx-auto my-4 px-3 flex-1">

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">

            <div class="bg-[var(--colour-warning)] p-6 text-center rounded-md">
                <h2 class="text-xl font-semibold">Div 1</h2>
            </div>

            <div class="bg-[var(--colour-success)] text-white p-6 text-center rounded-md">
                <h2 class="text-xl font-semibold">Div 2</h2>
            </div>

            <div class="bg-[var(--colour-info)] p-6 text-center rounded-md">
                <h2 class="text-xl font-semibold">Div 3</h2>
            </div>

            <div class="bg-[var(--colour-danger)] text-white p-6 text-center rounded-md">
                <h2 class="text-xl font-semibold">Div 4</h2>
            </div>

        </div>

    </main>
    <!-- STOP: Main Content -->


    <!-- START: Footer -->
    <footer class="bg-[var(--colour-dark)] text-white text-center p-6">
        <p class="mb-2">My Tailwind Footer</p>
        <a href="#html_template_modal"
            class="text-white underline"
            onclick="open_html_modal(event)">
            View HTML body markup
        </a> |  <a href="bootstrap.html"
        class="text-white underline">
        Bootstrap example 
    </a>
    </footer>
    <!-- STOP: Footer -->


    <!-- START: HTML Template Modal -->
    <div id="html_template_modal"
        class="hidden fixed inset-0 z-50 bg-black/75 p-4 flex items-center justify-center">

        <div class="relative w-full max-w-6xl max-h-full overflow-y-auto bg-white">

            <!-- Close Button -->
            <button type="button"
                class="btn-close absolute top-6 right-6 z-10 w-6 h-6"
                onclick="close_html_modal()"
                aria-label="Close">
            </button>

            <div class="p-0">
                <pre class="mb-0"><code id="html_template_code" class="language-html"></code></pre>
            </div>

        </div>

    </div>
    <!-- STOP: HTML Template Modal -->


    <!-- Prism JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>


    <script>

        // Variables
        let html_template = document.querySelector("main").outerHTML;
        let html_template_code = document.getElementById("html_template_code");
        let html_template_modal = document.getElementById("html_template_modal");


        // START: Modal Functions

        function open_html_modal(event) {

            event.preventDefault();

            // Insert the main HTML as text
            html_template_code.textContent = html_template;

            // Apply Prism syntax highlighting
            Prism.highlightElement(html_template_code);

            // Show the modal
            html_template_modal.classList.remove("hidden");

        }


        function close_html_modal() {

            // Hide the modal
            html_template_modal.classList.add("hidden");

        }

        // STOP: Modal Functions


        // Ready block

        // Close modal when clicking the background
        html_template_modal.addEventListener("click", function (event) {

            if (event.target === html_template_modal) {
                close_html_modal();
            }

        });


        // Close modal when pressing Escape
        document.addEventListener("keydown", function (event) {

            if (event.key === "Escape") {
                close_html_modal();
            }

        });

    </script>

</body>
</html>
